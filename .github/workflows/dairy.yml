name: Build daily briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        run: python main.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Send the push notification only after GitHub Pages deployment succeeds.
      - name: Notify phone via ntfy
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC is not configured; skipping phone notification."
            exit 0
          fi

          curl --fail --silent --show-error \
            -H "Title: Briefing du jour disponible" \
            -H "Priority: default" \
            -H "Tags: newspaper" \
            -H "Click: https://banbime.github.io/Briefing-public/" \
            -d "Le nouveau briefing a été généré et publié avec succès. Bonne lecture !" \
            "https://ntfy.sh/$NTFY_TOPIC"
